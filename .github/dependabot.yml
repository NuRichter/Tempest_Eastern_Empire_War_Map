# Weekly dependency updates. Minor and patch releases come grouped; majors one
# by one, so each can be reviewed and tested (see docs/security/MAINTENANCE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
